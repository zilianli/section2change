<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1d3f78"/>
      <stop offset="1" stop-color="#0a1630"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" x2="1">
      <stop offset="0" stop-color="#37c6ff"/>
      <stop offset="1" stop-color="#2a7bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 一段道路：深灰路面 + 白边线 + 中间虚线 -->
    <g id="road">
      <rect x="-210" y="-34" width="420" height="68" rx="6" fill="#3a3f47"/>
      <rect x="-210" y="-34" width="420" height="68" rx="6" fill="none" stroke="#d9dde3" stroke-width="5"/>
      <line x1="-200" y1="0" x2="200" y2="0" stroke="#f2f2f2" stroke-width="4" stroke-dasharray="18 14"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 背景网格（城市感） -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <path d="M0 128H1024M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024M0 896H1024M128 0V1024M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024M896 0V1024"/>
  </g>

  <!-- 标题 -->
  <text x="512" y="200" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="900" font-size="150" fill="#ffffff" letter-spacing="12" filter="url(#shadow)">平改立</text>
  <text x="512" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="54" letter-spacing="6">
    <tspan fill="#cfe3ff">SECTION</tspan><tspan fill="#ff8a3c" font-size="64" dx="8" dy="4">2</tspan><tspan fill="#cfe3ff" dx="8" dy="-4">CHANGE</tspan>
  </text>

  <!-- 左：平面十字路口 -->
  <g transform="translate(235 590) scale(0.88)" filter="url(#shadow)">
    <use href="#road"/>
    <use href="#road" transform="rotate(90)"/>
    <rect x="-34" y="-34" width="68" height="68" fill="#3a3f47"/>
    <!-- 人行横道 -->
    <g fill="#f2f2f2">
      <rect x="-30" y="-52" width="60" height="8"/><rect x="-30" y="44" width="60" height="8"/>
      <rect x="-52" y="-30" width="8" height="60"/><rect x="44" y="-30" width="8" height="60"/>
    </g>
  </g>

  <!-- 中：箭头 -->
  <path d="M450 560 H515 V528 L582 590 L515 652 V620 H450 Z" fill="url(#arrow)" filter="url(#glow)"/>

  <!-- 右：立交（苜蓿叶式环道 + 上层跨线桥） -->
  <g transform="translate(800 590) scale(0.88)">
    <!-- 四个环道 -->
    <g fill="none" stroke-width="22" filter="url(#shadow)">
      <circle cx="108" cy="-108" r="62" stroke="url(#ramp)"/>
      <circle cx="-108" cy="108" r="62" stroke="url(#ramp)"/>
      <circle cx="-108" cy="-108" r="62" stroke="#ff8a3c"/>
      <circle cx="108" cy="108" r="62" stroke="#ff8a3c"/>
    </g>
    <!-- 下层道路 -->
    <g filter="url(#shadow)"><use href="#road"/></g>
    <!-- 立柱 -->
    <g fill="#9aa3ae">
      <rect x="-58" y="-6" width="16" height="22" rx="3"/><rect x="42" y="-6" width="16" height="22" rx="3"/>
    </g>
    <!-- 上层跨线桥（加宽的阴影表示高差） -->
    <g transform="rotate(90)">
      <rect x="-210" y="-48" width="420" height="96" rx="10" fill="#000" fill-opacity="0.35" transform="translate(8 14)"/>
      <rect x="-210" y="-40" width="420" height="80" rx="8" fill="#4a505a"/>
      <rect x="-210" y="-40" width="420" height="80" rx="8" fill="none" stroke="#ffffff" stroke-width="6"/>
      <line x1="-200" y1="0" x2="200" y2="0" stroke="#ffd34d" stroke-width="5"/>
      <line x1="-200" y1="-20" x2="200" y2="-20" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="16 12"/>
      <line x1="-200" y1="20" x2="200" y2="20" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="16 12"/>
    </g>
  </g>

  <!-- 底部说明 -->
  <rect x="152" y="880" width="720" height="64" rx="32" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <text x="512" y="923" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-weight="600" font-size="30" fill="#cfe3ff" letter-spacing="3">路口一键升级立交 · INTERCHANGE MOD</text>
</svg>
